name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: production
        type: choice
        options:
          - production
          - preview

concurrency:
  group: deploy-${{ github.event.inputs.target }}
  cancel-in-progress: false

env:
  NODE_VERSION: 20
  PNPM_VERSION: 9.12.0

jobs:
  deploy-web:
    name: Deploy web (Vercel)
    runs-on: ubuntu-latest
    if: ${{ vars.VERCEL_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Vercel CLI
        run: pnpm add --global vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ github.event.inputs.target }} --token=$VERCEL_TOKEN
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      - name: Build with Vercel
        run: vercel build ${{ github.event.inputs.target == 'production' && '--prod' || '' }} --token=$VERCEL_TOKEN
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: vercel deploy --prebuilt ${{ github.event.inputs.target == 'production' && '--prod' || '' }} --token=$VERCEL_TOKEN
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  deploy-api:
    name: Deploy api (Docker)
    runs-on: ubuntu-latest
    if: ${{ vars.API_REGISTRY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.API_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ vars.API_REGISTRY }}/prism-k-api:${{ github.sha }}
            ${{ vars.API_REGISTRY }}/prism-k-api:${{ github.event.inputs.target }}
