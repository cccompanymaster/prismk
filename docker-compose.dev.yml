# Local development PostgreSQL for PRISM-K.
# `docker compose -f docker-compose.dev.yml up -d` then run
# `cd apps/api && pnpm prisma migrate dev`.
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prismk
      POSTGRES_PASSWORD: prismk
      POSTGRES_DB: prismk
    ports:
      - "5432:5432"
    volumes:
      - prismk-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prismk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  prismk-pg:
